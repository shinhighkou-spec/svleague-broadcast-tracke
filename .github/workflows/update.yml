name: Update SV.LEAGUE broadcasts

on:
  push:
    # Avoid self-triggering when this workflow commits generated data/site output.
    paths:
      - "scraper.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"
  schedule:
    # 06:00 JST = 21:00 UTC on the previous day
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install chromium

      - name: Run regression tests
        run: pytest -q

      - name: Collect broadcast data
        id: collect
        # Continue to deployment after collection failure, but keep the failure visible.
        # The next step restores the checked-out last known-good outputs before publishing.
        continue-on-error: true
        run: python scraper.py

      - name: Restore last known-good outputs after collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          git checkout -- data site
          echo "## Broadcast collection failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The last known-good data and site files were restored before deployment." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated data
        run: |
          git config user.name "svleague-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "Update SV.LEAGUE broadcast schedule"
          # A source/test commit may land while the scrape is running. Rebase the
          # generated output commit on the latest main before pushing; never force-push.
          git fetch origin main
          git rebase origin/main
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mark collection or source-discovery failure after safe deployment
        if: always() && (steps.collect.outcome == 'failure' || env.SV_SOURCE_DISCOVERY_DEGRADED == 'true')
        run: |
          if [ "${{ steps.collect.outcome }}" = "failure" ]; then
            echo "Collection failed. The prior known-good schedule was restored and deployed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Source discovery was incomplete. Verified rows were deployed, but one or more source searches failed; inspect the collection logs." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
