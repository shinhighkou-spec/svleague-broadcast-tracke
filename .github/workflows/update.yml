name: Update SV.LEAGUE broadcasts

on:
  push:
    # Avoid self-triggering when this workflow commits generated data/site output.
    paths:
      - "scraper.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"
  schedule:
    # 06:00 JST = 21:00 UTC on the previous day
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install chromium

      - name: Run regression tests
        run: pytest -q

      - name: Collect broadcast data
        # Do not block publication of the last known-good schedule when scraping fails.
        # scraper.py preserves previous data on validation failure; still deploy that schedule.
        run: python scraper.py || echo "::warning::Scraper failed; deploying the preserved last known-good schedule."

      - name: Commit updated data
        run: |
          git config user.name "svleague-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "Update SV.LEAGUE broadcast schedule"
          # A source/test commit may land while the scrape is running. Rebase the
          # generated output commit on the latest main before pushing; never force-push.
          git fetch origin main
          git rebase origin/main
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
